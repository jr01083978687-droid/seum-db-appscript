name: place-photo-downloader live test

# live-test.json 을 수정해서 푸시하면 실제 네이버 대상으로 실행된다.
on:
  push:
    paths:
      - "place-photo-downloader/live-test.json"
      - ".github/workflows/place-photo-downloader-live.yml"

jobs:
  live:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: place-photo-downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe Naver
        shell: pwsh
        run: |
          $ua = "Mozilla/5.0 (Linux; Android 14; SM-S918N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36"
          foreach ($u in @("https://naver.me/xa5WfSO3", "https://m.place.naver.com/", "https://m.blog.naver.com/", "https://pcmap-api.place.naver.com/graphql")) {
            "---- $u"
            curl.exe -s -o NUL -A $ua -w "%{http_code} redirect=%{redirect_url}`n" $u
          }
          "---- naver.me headers"
          curl.exe -sI -A $ua https://naver.me/xa5WfSO3
      - name: Run
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $cfg = Get-Content live-test.json -Raw -Encoding utf8 | ConvertFrom-Json
          $a = @($cfg.link, "--out", "output", "--max-reviews", "$($cfg.max_reviews)", "--start", $cfg.start, "--end", $cfg.end)
          if ($cfg.visitor) { $a += "--visitor" }
          python cli.py @a
          "exit=$LASTEXITCODE"
      - name: Report
        if: always()
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          Get-ChildItem -Recurse output -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          Get-ChildItem output\_진단 -ErrorAction SilentlyContinue | ForEach-Object {
            "===== $($_.Name) ====="
            $s = Get-Content $_.FullName -Raw -Encoding utf8
            if ($s) { $s.Substring(0, [Math]::Min(6000, $s.Length)) }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-output
          path: place-photo-downloader/output
          retention-days: 7
